<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trần Thanh Lộ · BIM/CAD Software Developer</title>
    <meta name="description" content="Portfolio 3D của Trần Thanh Lộ, BIM/CAD Software Developer tại Đà Nẵng." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="scene"></div>

    <header class="topbar">
      <button class="brand" id="home" type="button">
        <strong>Trần Thanh Lộ</strong>
        <span data-i18n="title"></span>
      </button>
      <div class="actions">
        <button class="chip" id="lights" type="button" aria-pressed="false"><i class="dot"></i><span data-i18n="lights"></span></button>
        <button class="chip" id="lang" type="button" data-i18n="lang"></button>
      </div>
    </header>

    <section class="intro" id="intro">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n-html="heading"></h1>
      <p class="intro-text" data-i18n="intro"></p>
      <button class="btn" id="start" type="button" data-i18n="start"></button>
    </section>

    <aside class="panel" id="panel" aria-live="polite">
      <button class="close" id="close" type="button">×</button>
      <p class="eyebrow" id="p-landmark"></p>
      <h2 id="p-section"></h2>
      <p class="fact" id="p-fact"></p>
      <div class="body" id="p-body"></div>
      <button class="btn ghost" id="p-action" type="button" hidden></button>
      <nav class="pager">
        <button type="button" id="prev" data-i18n="prev"></button>
        <span id="p-count"></span>
        <button type="button" id="next" data-i18n="next"></button>
      </nav>
    </aside>

    <nav class="stops" id="stops"></nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
